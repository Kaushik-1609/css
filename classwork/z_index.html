    <style>

  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
}
</style>
</head>
<body>
    <body>

<h1>This is a heading</h1>
<img src="https://img.magnific.com/free-photo/beautiful-landscape-with-tree_23-2151917912.jpg?semt=ais_hybrid&w=740&q=80" alt="tree">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
